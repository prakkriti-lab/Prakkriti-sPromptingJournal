<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ROBOPTIXX - Robot Assembly & Rigging</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1a1410; font-family: monospace; }
    #main { display: flex; width: 100%; height: 100%; }
    
    canvas { display: block; background: #FFFFFF; cursor: crosshair; flex: 1; }
    
    #sidebar { 
      width: 380px; 
      background: #1a1410; 
      border-left: 3px solid #FF8C00; 
      overflow-y: auto; 
      padding: 15px;
      flex-shrink: 0;
    }
    
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      margin: 10px 0;
    }
    
    .mode-tab {
      padding: 8px;
      background: #2a2015;
      border: 2px solid #A0522D;
      color: #FFE4B5;
      cursor: pointer;
      border-radius: 3px;
      font-size: 10px;
      text-align: center;
      transition: 0.2s;
    }
    
    .mode-tab.active {
      background: #FF8C00;
      border-color: #FFD700;
      color: #1a1410;
      font-weight: bold;
    }
    
    .mode-content { display: none; }
    .mode-content.active { display: block; }
    
    h2 { color: #FFD700; margin: 15px 0 10px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid #FF7F50; padding-bottom: 6px; }
    
    button { width: 100%; padding: 8px; margin: 4px 0; background: #FF8C00; color: #1a1410; border: none; cursor: pointer; font-weight: bold; border-radius: 3px; font-size: 10px; }
    button:hover { background: #FFA500; }
    button.active { background: #FF4444; }
    button.danger { background: #DC143C; }
    
    .info { background: rgba(46, 139, 87, 0.2); padding: 10px; margin: 8px 0; border-left: 3px solid #2E8B57; font-size: 9px; color: #FFE4B5; }
    
    input[type="file"] { display: none; }
    
    .file-input-label {
      display: block;
      width: 100%;
      padding: 10px;
      background: #2a2015;
      border: 2px dashed #FF8C00;
      color: #FFE4B5;
      text-align: center;
      cursor: pointer;
      border-radius: 3px;
      margin: 5px 0;
      font-size: 10px;
    }
    
    .file-input-label:hover { border-color: #FFA500; background: #3d2817; }
    
    .part-item {
      background: #2a2015;
      padding: 8px;
      margin: 4px 0;
      border: 1px solid #A0522D;
      cursor: pointer;
      border-radius: 3px;
      color: #FFE4B5;
      font-size: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .part-item:hover { border-color: #FF8C00; }
    .part-item.selected { background: #FF8C00; color: #1a1410; }
    
    .part-thumb {
      width: 30px;
      height: 30px;
      background: #3d2817;
      border: 1px solid #FF8C00;
      border-radius: 2px;
      display: inline-block;
    }
    
    .rigging-list {
      max-height: 150px;
      overflow-y: auto;
      background: #2a2015;
      border: 1px solid #A0522D;
      border-radius: 3px;
      padding: 5px;
      margin: 5px 0;
    }
    
    .rigging-item {
      background: #3d2817;
      padding: 5px;
      margin: 3px 0;
      border-left: 3px solid #2E8B57;
      font-size: 8px;
      color: #FFE4B5;
    }
    
    label { display: block; color: #FFE4B5; font-size: 10px; margin-top: 8px; }
    
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 5px;
      background: #2a2015;
      color: #FFD700;
      border: 1px solid #FF8C00;
      margin: 4px 0;
      border-radius: 2px;
      font-family: monospace;
      font-size: 10px;
    }
    
    .stats { font-size: 9px; color: #FFE4B5; margin: 5px 0; }
  </style>
</head>
<body>
  <div id="main">
    <canvas id="canvas"></canvas>
    <div id="sidebar">
      <h2>🤖 ROBOPTIXX v3.0</h2>
      <div class="mode-tabs">
        <div class="mode-tab active" onclick="switchMode('assembly')">⚙️ ASSEMBLY</div>
        <div class="mode-tab" onclick="switchMode('rigging')">🔗 RIGGING</div>
        <div class="mode-tab" onclick="switchMode('export')">💾 EXPORT</div>
      </div>
      
      <div id="assembly-mode" class="mode-content active">
        <h2>📦 Parts Library</h2>
        <label class="file-input-label" onclick="document.getElementById('partFile').click()">➕ Upload Part Image</label>
        <input type="file" id="partFile" accept="image/*" onchange="uploadPart()">
        <div id="partsList" class="rigging-list"></div>
        
        <label>Part Name:</label>
        <input type="text" id="partName" placeholder="e.g., Lifting_Limb">
        
        <label>Part Type:</label>
        <select id="partType" style="width:100%; padding:5px; background:#2a2015; color:#FFD700; border:1px solid #FF8C00;">
          <option>Limb</option>
          <option>Connector</option>
          <option>Joint</option>
          <option>Wheel</option>
        </select>
        
        <button onclick="addUploadedPart()">Add to Canvas</button>
        
        <h2>📐 Selected Part Size</h2>
        <label>Width:</label>
        <input type="number" id="widthInput" min="20" step="5" placeholder="Width" onchange="updateSelectedSize()">
        <label>Height:</label>
        <input type="number" id="heightInput" min="20" step="5" placeholder="Height" onchange="updateSelectedSize()">
        <div class="info">💡 Drag the ⬜ square to resize</div>
        
        <button class="danger" onclick="delete_part()">Delete Part</button>
      </div>
      
      <div id="rigging-mode" class="mode-content">
        <h2>🔗 Rigging System</h2>
        <button id="rigBtn" onclick="toggleRig()">Start Rigging</button>
        <div class="info" id="rigInfo">Select 2 parts to create joint</div>
        <h2>Joints Created</h2>
        <div id="jointsList" class="rigging-list"></div>
        <h2>Recording</h2>
        <button id="recordBtn" onclick="toggleRecord()">🔴 Start Record</button>
        <div class="stats" id="recordInfo">Not recording</div>
        <button onclick="export_rigging_data()">Export Rigging JSON</button>
      </div>
      
      <div id="export-mode" class="mode-content">
        <h2>💾 Code Export</h2>
        <button onclick="export_cpp_code()">📝 Arduino C++ Code</button>
        <button onclick="export_math_data()">📊 Kinematics Math</button>
        <button onclick="export_json()">📋 Full JSON</button>
        <h2>Output</h2>
        <textarea id="exportOutput" style="width:100%; height:200px; background:#2a2015; color:#FFD700; border:1px solid #FF8C00; padding:8px; font-family:monospace; font-size:9px;" readonly></textarea>
        <button onclick="copy_to_clipboard()">📋 Copy</button>
        <button onclick="download_file()">⬇️ Download</button>
      </div>
      
      <h2>Selected</h2>
      <div id="info" class="info">Click a part</div>
      <div class="stats" id="stats">0 parts | 0 joints</div>
      <button class="danger" onclick="clear_all()">Clear All</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let parts = [], joints = [], selected = null;
    let rig = false, rig_sel = [];
    let recording = false, recordedFrames = [];
    let uploadedImages = new Map();
    let currentMode = 'assembly';

    class Part {
      constructor(x, y, name, type, imgData = null) {
        this.id = Math.random();
        this.x = x;
        this.y = y;
        this.name = name;
        this.type = type;
        this.mass = 1;
        this.rotation = 0;
        this.scale = 1;
        this.imgData = imgData;
        this.width = 300;  // 6 inches
        this.height = 400; // 8 inches
      }

      draw(s) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation * Math.PI / 180);
        ctx.scale(this.scale, this.scale);

        if (this.imgData) {
          ctx.drawImage(this.imgData, -this.width/2, -this.height/2, this.width, this.height);
        } else {
          ctx.fillStyle = s ? '#FF4444' : '#FF7F50';
          ctx.strokeStyle = s ? '#FFD700' : '#FF8C00';
          ctx.lineWidth = 2;
          ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
          ctx.strokeRect(-this.width/2, -this.height/2, this.width, this.height);
        }

        if (s) {
          ctx.strokeStyle = '#FFD700';
          ctx.lineWidth = 3;
          ctx.strokeRect(-this.width/2 - 3, -this.height/2 - 3, this.width + 6, this.height + 6);
          ctx.fillStyle = '#FFD700';
          ctx.fillRect(this.width/2 - 6, this.height/2 - 6, 12, 12);
          ctx.strokeStyle = '#1a1410';
          ctx.lineWidth = 2;
          ctx.strokeRect(this.width/2 - 6, this.height/2 - 6, 12, 12);
          ctx.fillStyle = '#FFD700';
          ctx.font = 'bold 10px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(`${Math.round(this.width)}x${Math.round(this.height)}`, 0, -this.height/2 - 8);
        }

        ctx.restore();
      }

      hit(x, y) {
        const dx = x - this.x, dy = y - this.y;
        return dx > -this.width/2 && dx < this.width/2 && dy > -this.height/2 && dy < this.height/2;
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-content').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.mode-tab').forEach(e => e.classList.remove('active'));
      document.getElementById(mode + '-mode').classList.add('active');
      document.querySelector(`[onclick="switchMode('${mode}')`).classList.add('active');
      render();
    }

    function uploadPart() {
      const file = document.getElementById('partFile').files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const id = Math.random().toString(36);
          uploadedImages.set(id, img);
          updatePartsList();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function updatePartsList() {
      let html = '';
      uploadedImages.forEach(() => {
        html += `<div class="part-item"><span>📷 Part</span></div>`;
      });
      document.getElementById('partsList').innerHTML = html || '<div class="info">No parts</div>';
    }

    function addUploadedPart() {
      const name = document.getElementById('partName').value || 'Part_' + parts.length;
      const type = document.getElementById('partType').value;
      const img = Array.from(uploadedImages.values())[uploadedImages.size - 1];
      const p = new Part(canvas.width/3 + Math.random()*100, 100 + parts.length*60, name, type, img);
      parts.push(p);
      ui();
      render();
    }

    function toggleRig() {
      rig = !rig;
      rig_sel = [];
      document.getElementById('rigBtn').className = rig ? 'active' : '';
      ui();
      render();
    }

    function toggleRecord() {
      recording = !recording;
      if (recording) {
        recordedFrames = [];
        document.getElementById('recordBtn').textContent = '⏹️ Stop Record';
        document.getElementById('recordInfo').textContent = 'Recording... frames: 0';
      } else {
        document.getElementById('recordBtn').textContent = '🔴 Start Record';
        document.getElementById('recordInfo').textContent = `Recorded ${recordedFrames.length} frames`;
      }
    }

    function delete_part() {
      if (!selected) return;
      parts = parts.filter(p => p !== selected);
      joints = joints.filter(j => j.a !== selected && j.b !== selected);
      selected = null;
      ui();
      render();
    }

    function clear_all() {
      if (confirm('Clear all?')) {
        parts = [];
        joints = [];
        selected = null;
        rig = false;
        rig_sel = [];
        recordedFrames = [];
        ui();
        render();
      }
    }

    function ui() {
      let html = '';
      parts.forEach((p, i) => {
        html += `<div class="part-item${p===selected?' selected':''}" onclick="select_part(${i})"><span>${i+1}. ${p.name}</span><div class="part-thumb"></div></div>`;
      });
      document.getElementById('partsList').innerHTML = html || '<div class="info">No parts</div>';

      html = '';
      joints.forEach((j, i) => {
        const a = parts.indexOf(j.a);
        const b = parts.indexOf(j.b);
        html += `<div class="rigging-item">Joint ${i+1}: Part${a+1} ↔ Part${b+1}</div>`;
      });
      document.getElementById('jointsList').innerHTML = html || '<div class="info">No joints</div>';

      if (selected) {
        document.getElementById('info').textContent = `${selected.name}\nType: ${selected.type}\nPos: (${selected.x.toFixed(0)}, ${selected.y.toFixed(0)})`;
        document.getElementById('widthInput').value = Math.round(selected.width);
        document.getElementById('heightInput').value = Math.round(selected.height);
      } else {
        document.getElementById('info').textContent = 'Click a part';
        document.getElementById('widthInput').value = '';
        document.getElementById('heightInput').value = '';
      }

      document.getElementById('stats').textContent = `${parts.length} parts | ${joints.length} joints`;

      if (rig) {
        document.getElementById('rigInfo').textContent = `Selected: ${rig_sel.length}/2\nClick parts to rig`;
      }
    }

    function select_part(i) {
      selected = parts[i];
      if (selected) {
        document.getElementById('widthInput').value = Math.round(selected.width);
        document.getElementById('heightInput').value = Math.round(selected.height);
      }
      ui();
      render();
    }

    function updateSelectedSize() {
      if (!selected) return;
      const w = parseFloat(document.getElementById('widthInput').value);
      const h = parseFloat(document.getElementById('heightInput').value);
      if (w >= 20) selected.width = w;
      if (h >= 20) selected.height = h;
      render();
    }

    function render() {
      if (recording && currentMode === 'rigging') {
        recordedFrames.push({
          parts: parts.map(p => ({x:p.x, y:p.y, rot:p.rotation})),
          timestamp: Date.now()
        });
        document.getElementById('recordInfo').textContent = `Recording... frames: ${recordedFrames.length}`;
      }

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#E8E8E8';
      ctx.lineWidth = 0.8;
      for (let i=0; i<canvas.width; i+=50) {
        ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
      }

      ctx.strokeStyle = '#2E8B57';
      ctx.lineWidth = 3;
      joints.forEach(j => {
        ctx.beginPath();
        ctx.moveTo(j.a.x, j.a.y);
        ctx.lineTo(j.b.x, j.b.y);
        ctx.stroke();
      });

      parts.forEach(p => p.draw(p === selected));

      if (rig && rig_sel.length > 0) {
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 2;
        ctx.setLineDash([5,5]);
        rig_sel.forEach(p => {
          ctx.strokeRect(p.x-p.width/2-5, p.y-p.height/2-5, p.width+10, p.height+10);
        });
        ctx.setLineDash([]);
      }
    }

    canvas.addEventListener('click', (e) => {
      const r = canvas.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;

      for (let i=parts.length-1; i>=0; i--) {
        if (parts[i].hit(x, y)) {
          if (rig) {
            if (rig_sel.includes(parts[i])) rig_sel = rig_sel.filter(p => p !== parts[i]);
            else {
              rig_sel.push(parts[i]);
              if (rig_sel.length === 2) {
                joints.push({a: rig_sel[0], b: rig_sel[1]});
                rig_sel = [];
                rig = false;
                document.getElementById('rigBtn').className = '';
              }
            }
          } else {
            selected = parts[i];
          }
          ui(); render();
          return;
        }
      }
      selected = null; ui(); render();
    });

    let draggingResize = null;

    canvas.addEventListener('mousemove', (e) => {
      const r = canvas.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;

      if (draggingResize) {
        const dx = x - draggingResize.startX;
        const dy = y - draggingResize.startY;
        selected.width = Math.max(20, draggingResize.startW + dx);
        selected.height = Math.max(20, draggingResize.startH + dy);
        render();
      } else if (selected && !rig && currentMode === 'assembly') {
        selected.x = x;
        selected.y = y;
        render();
      }
    });

    canvas.addEventListener('mousedown', (e) => {
      if (!selected || rig || currentMode !== 'assembly') return;
      const r = canvas.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;

      const handleX = selected.x + selected.width/2;
      const handleY = selected.y + selected.height/2;
      if (Math.abs(x - handleX) < 8 && Math.abs(y - handleY) < 8) {
        draggingResize = {startX: x, startY: y, startW: selected.width, startH: selected.height};
        e.preventDefault();
      }
    });

    canvas.addEventListener('mouseup', () => {
      draggingResize = null;
    });

    function export_rigging_data() {
      const data = {
        parts: parts.map((p, i) => ({
          id: i,
          name: p.name,
          type: p.type,
          x: p.x,
          y: p.y,
          mass: p.mass,
          rotation: p.rotation
        })),
        joints: joints.map(j => ({
          partA: parts.indexOf(j.a),
          partB: parts.indexOf(j.b),
          type: 'hinge'
        }))
      };
      document.getElementById('exportOutput').value = JSON.stringify(data, null, 2);
    }

    function export_cpp_code() {
      let code = `// ROBOPTIXX - Auto-generated Arduino Code\n#include <Servo.h>\n\n`;
      code += `// ${parts.length} Servos/Motors\n`;
      parts.forEach((p, i) => {
        code += `Servo servo${i}; // ${p.name}\n`;
      });
      code += `\nvoid setup() {\n`;
      parts.forEach((p, i) => {
        code += `  servo${i}.attach(${9+i});\n`;
      });
      code += `}\n\nvoid loop() {\n`;
      code += `  // Control logic here\n`;
      code += `}\n`;
      document.getElementById('exportOutput').value = code;
    }

    function export_math_data() {
      let math = `KINEMATICS DATA\n${'='.repeat(50)}\n\n`;
      math += `Total Parts: ${parts.length}\n`;
      math += `Total Joints: ${joints.length}\n\n`;
      
      math += `PART POSITIONS:\n`;
      parts.forEach((p, i) => {
        math += `Part${i+1} (${p.name}): (${p.x.toFixed(2)}, ${p.y.toFixed(2)})\n`;
      });
      
      math += `\nJOINT CONSTRAINTS:\n`;
      joints.forEach((j, i) => {
        const a = parts.indexOf(j.a);
        const b = parts.indexOf(j.b);
        const dist = Math.sqrt(Math.pow(j.a.x-j.b.x, 2) + Math.pow(j.a.y-j.b.y, 2));
        math += `Joint${i+1}: Part${a+1} ↔ Part${b+1} | Distance: ${dist.toFixed(2)}px\n`;
      });
      
      document.getElementById('exportOutput').value = math;
    }

    function export_json() {
      export_rigging_data();
    }

    function copy_to_clipboard() {
      const text = document.getElementById('exportOutput').value;
      navigator.clipboard.writeText(text);
      alert('✅ Copied!');
    }

    function download_file() {
      const text = document.getElementById('exportOutput').value;
      const blob = new Blob([text], {type: 'text/plain'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'roboptixx.txt';
      a.click();
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth - 380;
      canvas.height = window.innerHeight;
      render();
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    ui();
    setInterval(render, 1000/60);
  </script>
</body>
</html>
