<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROBOPTIXX - Cloud Edition</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #20242a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #67b7ff;
      font-family: monospace;
      z-index: 9999;
    }
    .loading.hidden { display: none; }
  </style>
</head>
<body>
  <div class="loading" id="loading-screen">
    <div style="text-align: center;">
      <h2>ROBOPTIXX</h2>
      <p>Initializing cloud environment...</p>
      <div style="font-size: 12px; color: #888; margin-top: 20px;">
        <div id="init-status">Loading dependencies...</div>
      </div>
    </div>
  </div>

  <div id="app" style="display: none;">
    <header id="top-bar">
      <button id="new-project">New</button>
      <button id="save-project">Save</button>
      <label class="file-label">Import<input id="load-project" type="file" accept="application/json" hidden /></label>
      <button id="toggle-simulate">Simulate</button>
      <button id="export-arduino">Export Arduino</button>
      <label><input type="checkbox" id="toggle-minimap" checked /> Minimap</label>
      <label><input type="checkbox" id="toggle-gravity" checked /> Gravity</label>
    </header>

    <aside id="left-panel">
      <h3>Parts</h3>
      <label>Category
        <select id="part-category"></select>
      </label>
      <div id="part-buttons"></div>
      <button id="create-hinge">Create Hinge (2x)</button>
      <button id="delete-selected">Delete Selected</button>
    </aside>

    <main id="viewport-wrap">
      <canvas id="viewport"></canvas>
      <canvas id="minimap"></canvas>
      <div id="snap-indicator"></div>
    </main>

    <aside id="right-panel">
      <h3>Inspector</h3>
      <div id="inspector-empty">Select a part or joint.</div>
      <div id="inspector-fields" class="hidden">
        
        <!-- Part Name Section -->
        <div style="background: rgba(103, 183, 255, 0.1); padding: 8px; border-radius: 4px; margin-bottom: 10px; border: 1px solid #67b7ff;">
          <label style="font-weight: bold; color: #67b7ff;">🏷️ Part Details</label>
          <label>Name <input id="ins-part-name" type="text" placeholder="e.g., Lifting_Limb" style="margin-top: 4px;" /></label>
          <label>ID <input id="ins-part-id" type="text" readonly style="background: #333; color: #888; margin-top: 4px;" /></label>
          <label>Category <input id="ins-part-category" type="text" readonly style="background: #333; color: #888; margin-top: 4px;" /></label>
          
          <!-- Image Preview -->
          <div id="ins-part-image" style="
            width: 100%;
            height: 120px;
            background: #1a1a25;
            border: 2px solid #89ff7a;
            border-radius: 6px;
            margin-top: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 12px;
          ">No image</div>
        </div>

        <!-- Mass & Physics -->
        <label>Mass (kg) <input id="ins-mass" type="number" step="0.1" min="0" /></label>
        
        <!-- Joint Controls -->
        <label>Min Angle (°) <input id="ins-min-angle" type="number" /></label>
        <label>Max Angle (°) <input id="ins-max-angle" type="number" /></label>
        <label>Speed (°/s) <input id="ins-speed" type="number" min="1" /></label>
        <label>Arduino Pin <input id="ins-pin" type="number" min="0" max="53" /></label>
        <label><input id="ins-motor" type="checkbox" /> Motor Enabled</label>
      </div>
    </aside>

    <footer id="bottom-panel">
      <button id="timeline-record">Record</button>
      <button id="timeline-play">Play</button>
      <button id="timeline-stop">Stop</button>
      <button id="timeline-clear">Clear</button>
      <label>Speed <input id="timeline-speed" type="number" min="0.1" step="0.1" value="1" /></label>
      <span id="timeline-status">Timeline: Idle</span>
    </footer>
  </div>

  <script type="module">
    // Show/hide loading screen based on initialization
    const loadingScreen = document.getElementById('loading-screen');
    const appDiv = document.getElementById('app');
    const statusDiv = document.getElementById('init-status');

    window.showLoading = (message) => {
      statusDiv.textContent = message;
      loadingScreen.classList.remove('hidden');
    };

    window.hideLoading = () => {
      loadingScreen.classList.add('hidden');
      appDiv.style.display = '';
    };

    // Import and run main application
    import('./main.js').catch((error) => {
      statusDiv.innerHTML = `<span style="color: #f44336;">Error: ${error.message}</span>`;
    });
  </script>
</body>
</html>
