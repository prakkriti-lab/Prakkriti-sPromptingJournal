<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ROBOPTIXX - Robot Builder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1410; color: #FFE4B5; font-family: monospace; }
    #main { display: flex; width: 100vw; height: 100vh; }
    #canvas { flex: 1; background: #2a2015; }
    #sidebar { width: 280px; background: #1a1410; border-left: 2px solid #FF8C00; overflow-y: auto; padding: 15px; }
    h2 { color: #FFD700; margin: 15px 0 10px 0; }
    button { width: 100%; padding: 8px; margin: 5px 0; background: #FF8C00; color: #1a1410; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #FFA500; }
    button.active { background: #FF4444; }
    button.danger { background: #DC143C; }
    .info { background: rgba(46, 139, 87, 0.2); padding: 10px; margin: 10px 0; border-left: 3px solid #2E8B57; font-size: 10px; }
    input { width: 100%; padding: 5px; background: #2a2015; color: #FFD700; border: 1px solid #FF8C00; margin: 5px 0; }
    .part-item { background: #2a2015; padding: 8px; margin: 5px 0; border: 1px solid #A0522D; cursor: pointer; }
    .part-item:hover { background: #3d2817; border-color: #FF8C00; }
    .part-item.selected { background: #FF8C00; color: #1a1410; font-weight: bold; }
  </style>
</head>
<body>
  <div id="main">
    <canvas id="canvas"></canvas>
    <div id="sidebar">
      <h2>🤖 ROBOPTIXX</h2>
      <h2>Add Parts</h2>
      <button onclick="addPart('box')">📦 Cube</button>
      <button onclick="addPart('circle')">⚪ Circle</button>
      <button onclick="addPart('rect')">📋 Plate</button>
      <h2>Rigging</h2>
      <button id="rigBtn" onclick="toggleRig()">🔗 Start Rig</button>
      <div class="info" id="rigInfo">Click 2 parts to joint</div>
      <h2>Parts</h2>
      <div id="partsList"></div>
      <h2>Selected</h2>
      <div id="info" class="info">Click a part</div>
      <label>Mass: <input id="mass" type="number" value="1" min="0.1"></label>
      <button class="danger" onclick="delete_part()">Delete</button>
      <button class="danger" onclick="clear_all()">Clear All</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let parts = [], joints = [], selected = null, rig = false, rig_sel = [];
    class Part {
      constructor(x, y, type) {
        this.x = x; this.y = y; this.type = type; this.mass = 1; this.w = 50; this.h = 50; this.r = 25;
      }
      draw(s) {
        ctx.fillStyle = s ? '#FF4444' : '#FF7F50';
        ctx.strokeStyle = s ? '#FFD700' : '#FF8C00';
        ctx.lineWidth = 2;
        if (this.type === 'box') { ctx.fillRect(this.x-this.w/2, this.y-this.h/2, this.w, this.h); ctx.strokeRect(this.x-this.w/2, this.y-this.h/2, this.w, this.h); }
        else { ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill(); ctx.stroke(); }
        ctx.fillStyle = '#1a1410'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center'; ctx.fillText(parts.indexOf(this)+1, this.x, this.y+3);
      }
      hit(x, y) { if (this.type === 'box') return x > this.x-this.w/2 && x < this.x+this.w/2 && y > this.y-this.h/2 && y < this.y+this.h/2; else { const dx=x-this.x, dy=y-this.y; return Math.sqrt(dx*dx+dy*dy) < this.r; }}
    }
    function addPart(t) { parts.push(new Part(Math.random()*canvas.width*0.6+100, Math.random()*canvas.height*0.6+100, t)); ui(); render(); }
    function delete_part() { if (!selected) return; parts = parts.filter(p => p !== selected); joints = joints.filter(j => j.a !== selected && j.b !== selected); selected = null; ui(); render(); }
    function clear_all() { if (confirm('Clear?')) { parts = []; joints = []; selected = null; rig = false; rig_sel = []; ui(); render(); }}
    function toggleRig() { rig = !rig; rig_sel = []; document.getElementById('rigBtn').className = rig ? 'active' : ''; ui(); render(); }
    function ui() {
      let html = ''; parts.forEach((p, i) => { html += `<div class="part-item${p===selected?' selected':''}" onclick="select_part(${i})">${i+1}. ${p.type} (${p.mass}kg)</div>`; });
      document.getElementById('partsList').innerHTML = html;
      if (selected) { document.getElementById('info').textContent = `${selected.type}\nMass: ${selected.mass}kg\nJoints: ${joints.filter(j => j.a===selected || j.b===selected).length}`; }
      else { document.getElementById('info').textContent = 'Click a part'; }
      if (rig) { document.getElementById('rigInfo').textContent = `Selected: ${rig_sel.length}/2`; }
    }
    function select_part(i) { selected = parts[i]; document.getElementById('mass').value = selected.mass; ui(); render(); }
    function render() {
      ctx.fillStyle = '#1a1410'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(255,140,0,0.1)'; ctx.lineWidth = 1;
      for (let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
      ctx.strokeStyle = '#2E8B57'; ctx.lineWidth = 2;
      joints.forEach(j => { ctx.beginPath(); ctx.moveTo(j.a.x,j.a.y); ctx.lineTo(j.b.x,j.b.y); ctx.stroke(); });
      parts.forEach(p => p.draw(p === selected));
      if (rig && rig_sel.length > 0) { ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 2; ctx.setLineDash([5,5]); rig_sel.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.r+5, 0, Math.PI*2); ctx.stroke(); }); ctx.setLineDash([]); }
    }
    canvas.addEventListener('click', (e) => {
      const r = canvas.getBoundingClientRect(), x = e.clientX-r.left, y = e.clientY-r.top;
      for (let i=parts.length-1; i>=0; i--) {
        if (parts[i].hit(x, y)) {
          if (rig) {
            if (rig_sel.includes(parts[i])) rig_sel = rig_sel.filter(p => p !== parts[i]);
            else {
              rig_sel.push(parts[i]);
              if (rig_sel.length === 2) { joints.push({a: rig_sel[0], b: rig_sel[1]}); rig_sel = []; rig = false; document.getElementById('rigBtn').className = ''; }
            }
          } else {
            selected = parts[i];
            document.getElementById('mass').value = parts[i].mass;
          }
          ui(); render();
          return;
        }
      }
      selected = null; ui(); render();
    });
    canvas.addEventListener('mousemove', (e) => {
      if (selected && !rig) {
        const r = canvas.getBoundingClientRect();
        selected.x = e.clientX - r.left;
        selected.y = e.clientY - r.top;
        render();
      }
    });
    document.getElementById('mass').addEventListener('change', () => {
      if (selected) { selected.mass = parseFloat(document.getElementById('mass').value) || 1; if (selected.mass <= 0) selected.mass = 0.1; ui(); }
    });
    function resizeCanvas() { canvas.width = window.innerWidth - 280; canvas.height = window.innerHeight; render(); }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    ui();
  </script>
</body>
</html>
