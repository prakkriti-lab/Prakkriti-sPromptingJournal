<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ROBOPTIXX - Robot Assembly & Rigging</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1a1410; font-family: monospace; }
    #main { display: flex; width: 100%; height: 100%; }
    
    canvas { background: #FFFFFF; flex: 1; cursor: crosshair; }
    
    #sidebar { 
      width: 350px; 
      background: #1a1410; 
      border-left: 3px solid #FF8C00; 
      overflow-y: auto; 
      padding: 15px;
    }
    
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      margin: 10px 0 15px 0;
    }
    
    .mode-tab {
      padding: 8px;
      background: #2a2015;
      border: 2px solid #A0522D;
      color: #FFE4B5;
      cursor: pointer;
      border-radius: 3px;
      font-size: 10px;
      text-align: center;
      font-weight: bold;
    }
    
    .mode-tab.active {
      background: #FF8C00;
      border-color: #FFD700;
      color: #1a1410;
    }
    
    .mode-content { display: none; }
    .mode-content.active { display: block; }
    
    h2 { color: #FFD700; margin: 15px 0 8px 0; font-size: 11px; border-bottom: 1px solid #FF7F50; padding-bottom: 5px; }
    
    button { 
      width: 100%; 
      padding: 8px; 
      margin: 5px 0; 
      background: #FF8C00; 
      color: #1a1410; 
      border: none; 
      cursor: pointer; 
      font-weight: bold;
      border-radius: 3px;
      font-size: 11px;
    }
