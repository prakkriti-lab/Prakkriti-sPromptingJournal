<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ROBOPTIXX - Robot Assembly</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1a1410; font-family: monospace; }
    #main { display: flex; width: 100%; height: 100%; }
    
    canvas { background: #FFFFFF; flex: 1; cursor: crosshair; }
    
    #sidebar { 
      width: 350px; 
      background: #1a1410; 
      border-left: 3px solid #FF8C00; 
      overflow-y: auto; 
      padding: 15px;
    }
    
    h2 { color: #FFD700; margin: 15px 0 8px 0; font-size: 11px; border-bottom: 1px solid #FF7F50; padding-bottom: 5px; }
    
    button { 
      width: 100%; 
      padding: 8px; 
      margin: 5px 0; 
      background: #FF8C00; 
      color: #1a1410; 
      border: none; 
      cursor: pointer; 
      font-weight: bold;
      border-radius: 3px;
      font-size: 11px;
    }
    button:hover { background: #FFA500; }
    button.danger { background: #DC143C; }
    
    .file-input-label {
      display: block;
      width: 100%;
      padding: 10px;
      background: #2a2015;
      border: 2px dashed #FF8C00;
      color: #FFE4B5;
      text-align: center;
      cursor: pointer;
      border-radius: 3px;
      margin: 5px 0;
      font-size: 10px;
    }
    .file-input-label:hover { border-color: #FFA500; }
    
    .part-box {
      background: #2a2015;
      padding: 8px;
      margin: 5px 0;
      border: 1px solid #A0522D;
      color: #FFE4B5;
      font-size: 9px;
      cursor: pointer;
      border-radius: 3px;
    }
    .part-box:hover { border-color: #FF8C00; }
    .part-box.selected { background: #FF8C00; color: #1a1410; }
    
    input[type="text"], input[type="number"] { 
      width: 100%; 
      padding: 5px; 
      margin: 5px 0; 
      background: #2a2015; 
      color: #FFD700; 
      border: 1px solid #FF8C00; 
      border-radius: 2px; 
      font-family: monospace; 
    }
    
    input[type="file"] { display: none; }
    
    label { color: #FFE4B5; font-size: 10px; display: block; margin-top: 8px; }
    
    .info { background: #2a2015; padding: 8px; margin: 8px 0; border-left: 2px solid #FF8C00; color: #FFE4B5; font-size: 9px; }
  </style>
</head>
<body>
  <div id="main">
    <canvas id="canvas"></canvas>
    <div id="sidebar">
      <h2>🤖 ROBOPTIXX</h2>
      
      <h2>📷 Upload Image</h2>
      <label class="file-input-label" onclick="document.getElementById('imageFile').click()">
        ➕ Choose Image (6x8 inch)
      </label>
      <input type="file" id="imageFile" accept="image/*" onchange="uploadImage()">
      
      <h2>📋 Part Info</h2>
      <label>Part Name:</label>
      <input type="text" id="partName" placeholder="e.g. Lifting_Limb">
      
      <label>Part Type:</label>
      <select id="partType" style="width:100%; padding:5px; background:#2a2015; color:#FFD700; border:1px solid #FF8C00; margin: 5px 0;">
        <option>Limb</option>
        <option>Joint</option>
        <option>Core</option>
        <option>Wheel</option>
      </select>
      
      <button onclick="addPart()">Add to Canvas</button>
      
      <h2>📦 Parts List</h2>
      <div id="partsList" class="info">No parts yet</div>
      
      <h2>📐 Resize Selected</h2>
      <label>Width (px):</label>
      <input type="number" id="widthInput" value="300" onchange="updateSize()">
      <label>Height (px):</label>
      <input type="number" id="heightInput" value="400" onchange="updateSize()">
      <div class="info">💡 Drag corner to resize</div>
      
      <h2>Actions</h2>
      <button class="danger" onclick="deleteSelected()">Delete</button>
      <button class="danger" onclick="clearAll()">Clear All</button>
      
      <h2>Info</h2>
      <div id="info" class="info">Click a part</div>
      <div class="info" id="stats">0 parts</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let parts = [];
    let selected = null;
    let draggingResize = null;
    let uploadedImage = null;

    class Part {
      constructor(x, y, name, type, img) {
        this.x = x;
        this.y = y;
        this.name = name;
        this.type = type;
        this.width = 300;
        this.height = 400;
        this.image = img;
      }

      draw(isSelected) {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        if (this.image) {
          ctx.drawImage(this.image, -this.width/2, -this.height/2, this.width, this.height);
        } else {
          ctx.fillStyle = isSelected ? '#FF4444' : '#FF7F50';
          ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
        }
        
        ctx.strokeStyle = isSelected ? '#FFD700' : '#FF8C00';
        ctx.lineWidth = 3;
        ctx.strokeRect(-this.width/2, -this.height/2, this.width, this.height);
        
        if (!this.image) {
          ctx.fillStyle = '#1a1410';
          ctx.font = 'bold 14px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(this.name, 0, 0);
        }
        
        if (isSelected) {
          ctx.fillStyle = '#FFD700';
          ctx.fillRect(this.width/2 - 8, this.height/2 - 8, 16, 16);
          
          ctx.fillStyle = '#FFD700';
          ctx.font = 'bold 10px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(`${Math.round(this.width)}x${Math.round(this.height)}`, 0, -this.height/2 - 15);
        }
        
        ctx.restore();
      }

      hit(x, y) {
        const dx = Math.abs(x - this.x);
        const dy = Math.abs(y - this.y);
        return dx < this.width/2 && dy < this.height/2;
      }
    }

    function uploadImage() {
      const file = document.getElementById('imageFile').files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          uploadedImage = img;
          console.log('Image loaded');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function addPart() {
      if (!uploadedImage) {
        alert('Upload image first');
        return;
      }
      
      const name = document.getElementById('partName').value || 'Part_' + (parts.length + 1);
      const type = document.getElementById('partType').value;
      
      const x = canvas.width/3 + Math.random() * 150;
      const y = 100 + parts.length * 100;
      const p = new Part(x, y, name, type, uploadedImage);
      parts.push(p);
      selected = p;
      
      updateUI();
      render();
    }

    function updateUI() {
      let html = '';
      parts.forEach((p, i) => {
        html += `<div class="part-box${p === selected ? ' selected' : ''}" onclick="selectPart(${i})">${i+1}. ${p.name} (${p.width}x${p.height}px)</div>`;
      });
      document.getElementById('partsList').innerHTML = html || '<div style="color: #aaa;">No parts yet</div>';
      
      if (selected) {
        document.getElementById('info').textContent = `${selected.name}\nType: ${selected.type}\nPos: (${Math.round(selected.x)}, ${Math.round(selected.y)})`;
        document.getElementById('widthInput').value = Math.round(selected.width);
        document.getElementById('heightInput').value = Math.round(selected.height);
      } else {
        document.getElementById('info').textContent = 'Click a part';
        document.getElementById('widthInput').value = '';
        document.getElementById('heightInput').value = '';
      }
      
      document.getElementById('stats').textContent = `${parts.length} parts`;
    }

    function selectPart(i) {
      selected = parts[i];
      updateUI();
      render();
    }

    function updateSize() {
      if (!selected) return;
      const w = parseFloat(document.getElementById('widthInput').value);
      const h = parseFloat(document.getElementById('heightInput').value);
      if (w >= 50) selected.width = w;
      if (h >= 50) selected.height = h;
      render();
    }

    function deleteSelected() {
      if (!selected) return;
      parts = parts.filter(p => p !== selected);
      selected = null;
      updateUI();
      render();
    }

    function clearAll() {
      if (confirm('Clear all parts?')) {
        parts = [];
        selected = null;
        updateUI();
        render();
      }
    }

    function render() {
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.strokeStyle = '#EEEEEE';
      ctx.lineWidth = 0.5;
      for (let i = 0; i < canvas.width; i += 50) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i < canvas.height; i += 50) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }
      
      parts.forEach(p => p.draw(p === selected));
      
      ctx.fillStyle = '#FFD700';
      ctx.font = '12px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`Parts: ${parts.length}`, 10, 20);
    }

    canvas.addEventListener('click', (e) => {
      const r = canvas.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      
      for (let i = parts.length - 1; i >= 0; i--) {
        if (parts[i].hit(x, y)) {
          selected = parts[i];
          updateUI();
          render();
          return;
        }
      }
      selected = null;
      updateUI();
      render();
    });

    canvas.addEventListener('mousemove', (e) => {
      const r = canvas.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      
      if (draggingResize && selected) {
        const dx = x - draggingResize.startX;
        const dy = y - draggingResize.startY;
        selected.width = Math.max(50, draggingResize.startW + dx);
        selected.height = Math.max(50, draggingResize.startH + dy);
        render();
      } else if (selected) {
        selected.x = x;
        selected.y = y;
        render();
      }
    });

    canvas.addEventListener('mousedown', (e) => {
      if (!selected) return;
      const r = canvas.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      
      const handleX = selected.x + selected.width/2;
      const handleY = selected.y + selected.height/2;
      if (Math.abs(x - handleX) < 10 && Math.abs(y - handleY) < 10) {
        draggingResize = {startX: x, startY: y, startW: selected.width, startH: selected.height};
      }
    });

    canvas.addEventListener('mouseup', () => {
      draggingResize = null;
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth - 350;
      canvas.height = window.innerHeight;
      render();
    });

    function init() {
      canvas.width = window.innerWidth - 350;
      canvas.height = window.innerHeight;
      updateUI();
      render();
    }

    init();
  </script>
</body>
</html>
