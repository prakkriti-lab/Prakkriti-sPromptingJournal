<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBOPTIXX Skeleton Animator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            display: flex;
            height: 100vh;
            background: #1a1410;
            font-family: monospace;
        }
        
        canvas {
            flex: 1;
            background: white;
            cursor: crosshair;
        }
        
        #sidebar {
            width: 320px;
            background: #1a1410;
            border-left: 3px solid #FF8C00;
            overflow-y: auto;
            padding: 15px;
            color: #FFD700;
        }
        
        h2 { 
            color: #FFD700;
            font-size: 12px;
            margin: 15px 0 8px 0;
            border-bottom: 1px solid #FF8C00;
            padding-bottom: 5px;
        }
        
        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #FF8C00;
            color: #1a1410;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-family: monospace;
            font-size: 11px;
        }
        
        button:hover {
            background: #FFA500;
        }
        
        button.danger {
            background: #DC143C;
        }
        
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            margin-bottom: 15px;
        }
        
        .tab-btn {
            padding: 8px;
            background: #2a2015;
            border: 2px solid #A0522D;
            color: #FFE4B5;
            cursor: pointer;
            font-size: 10px;
        }
        
        .tab-btn.active {
            background: #FF8C00;
            border-color: #FFD700;
            color: #1a1410;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        input[type="file"],
        input[type="text"],
        select {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background: #2a2015;
            color: #FFD700;
            border: 1px solid #FF8C00;
            font-family: monospace;
            font-size: 10px;
        }
        
        .info-box {
            background: #2a2015;
            padding: 8px;
            margin: 8px 0;
            border-left: 2px solid #FF8C00;
            color: #FFE4B5;
            font-size: 9px;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .joint-item {
            background: #3d2817;
            padding: 5px;
            margin: 3px 0;
            border-left: 3px solid #2E8B57;
            font-size: 9px;
            cursor: pointer;
        }
        
        textarea {
            width: 100%;
            height: 150px;
            background: #2a2015;
            color: #FFD700;
            border: 1px solid #FF8C00;
            padding: 8px;
            font-family: monospace;
            font-size: 8px;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="sidebar">
        <h2>🤖 ROBOPTIXX</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(0)">🔨 BUILD</button>
            <button class="tab-btn" onclick="switchTab(1)">🎬 ANIMATE</button>
            <button class="tab-btn" onclick="switchTab(2)">💾 EXPORT</button>
        </div>
        
        <div class="tab-content active" id="tab-0">
            <h2>📷 Upload Image</h2>
            <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload()">
            
            <h2>📝 Part Info</h2>
            <input type="text" id="partName" placeholder="Part name">
            <button onclick="addPart()">➕ Add Part</button>
            
            <h2>📦 Parts List</h2>
            <div class="info-box" id="partsList">
                <div style="color: #AAA;">No parts yet</div>
            </div>
        </div>
        
        <div class="tab-content" id="tab-1">
            <h2>🎬 Animation</h2>
            <button onclick="recordFrame()">⏺️ Record Frame</button>
            <div class="info-box" id="frameInfo">
                <div>Frames: <strong>0</strong></div>
            </div>
            
            <h2>▶️ Playback</h2>
            <button id="playBtn" onclick="playAnimation()">▶️ Play</button>
            <button class="danger" onclick="stopAnimation()">⏹️ Stop</button>
            
            <h2>📊 Timeline</h2>
            <input type="range" id="timeline" min="0" max="0" value="0" onchange="scrubTimeline()">
            <div class="info-box" id="timelineInfo">
                <div>Frame: 0/0</div>
            </div>
        </div>
        
        <div class="tab-content" id="tab-2">
            <h2>💾 Export</h2>
            <button onclick="exportJSON()">📥 Export JSON</button>
            
            <h2>Output</h2>
            <textarea id="jsonOutput" readonly></textarea>
            
            <button onclick="copyToClipboard()">📋 Copy</button>
            <button onclick="downloadJSON()">⬇️ Download</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let parts = [];
        let selectedPart = null;
        let uploadedImage = null;
        let recordedFrames = [];
        let isPlaying = false;
        let currentFrameIndex = 0;
        let draggedJointInfo = null;

        class RobotPart {
            constructor(x, y, name, image) {
                this.x = x;
                this.y = y;
                this.name = name;
                this.image = image;
                this.width = 300;
                this.height = 400;
                this.joints = [];
                this.connections = [];
            }

            contains(x, y) {
                return Math.abs(x - this.x) < this.width / 2 && Math.abs(y - this.y) < this.height / 2;
            }

            getJointAt(x, y) {
                for (let i = 0; i < this.joints.length; i++) {
                    const joint = this.joints[i];
                    const jx = this.x + joint.x;
                    const jy = this.y + joint.y;
                    if (Math.abs(x - jx) < 10 && Math.abs(y - jy) < 10) return i;
                }
                return -1;
            }

            draw(ctx, isSelected) {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.image) {
                    ctx.drawImage(this.image, -this.width / 2, -this.height / 2, this.width, this.height);
                } else {
                    ctx.fillStyle = isSelected ? '#FF4444' : '#FF7F50';
                    ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
                }

                ctx.strokeStyle = isSelected ? '#FFD700' : '#FF8C00';
                ctx.lineWidth = 3;
                ctx.strokeRect(-this.width / 2, -this.height / 2, this.width, this.height);

                ctx.strokeStyle = '#2E8B57';
                ctx.lineWidth = 3;
                for (let conn of this.connections) {
                    const j1 = this.joints[conn[0]];
                    const j2 = this.joints[conn[1]];
                    if (j1 && j2) {
                        ctx.beginPath();
                        ctx.moveTo(j1.x, j1.y);
                        ctx.lineTo(j2.x, j2.y);
                        ctx.stroke();
                    }
                }

                for (let joint of this.joints) {
                    ctx.fillStyle = '#00FF00';
                    ctx.fillRect(joint.x - 6, joint.y - 6, 12, 12);
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(joint.x - 6, joint.y - 6, 12, 12);
                }

                ctx.restore();
            }
        }

        function switchTab(tabIndex) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabIndex).classList.add('active');
            event.target.classList.add('active');
        }

        function handleImageUpload() {
            const file = document.getElementById('imageInput').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => uploadedImage = img;
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function addPart() {
            if (!uploadedImage) { alert('Upload image first!'); return; }
            const name = document.getElementById('partName').value || `Part_${parts.length}`;
            const newPart = new RobotPart(canvas.width / 3, 150 + parts.length * 150, name, uploadedImage);
            parts.push(newPart);
            selectedPart = newPart;
            document.getElementById('partName').value = '';
            updatePartsUI();
            render();
        }

        function updatePartsUI() {
            let html = '';
            if (parts.length === 0) {
                html = '<div style="color: #AAA;">No parts yet</div>';
            } else {
                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i];
                    const style = part === selectedPart ? 'background: #FF8C00; color: #1a1410;' : 'background: #3d2817; color: #FFE4B5;';
                    html += `<div class="joint-item" style="${style}" onclick="selectPart(${i})">${part.name} [${part.joints.length}J]</div>`;
                }
            }
            document.getElementById('partsList').innerHTML = html;
        }

        function selectPart(index) {
            selectedPart = parts[index];
            updatePartsUI();
            render();
        }

        function recordFrame() {
            if (!selectedPart) { alert('Select part!'); return; }
            const frame = selectedPart.joints.map(j => ({x: j.x, y: j.y}));
            recordedFrames.push(frame);
            document.getElementById('frameInfo').innerHTML = `<div>Frames: <strong>${recordedFrames.length}</strong></div>`;
            document.getElementById('timeline').max = Math.max(recordedFrames.length - 1, 0);
        }

        function playAnimation() {
            if (recordedFrames.length === 0) { alert('Record frames!'); return; }
            isPlaying = !isPlaying;
            document.getElementById('playBtn').textContent = isPlaying ? '⏸️ Pause' : '▶️ Play';
            if (isPlaying) animateLoop();
        }

        function animateLoop() {
            if (!isPlaying || !selectedPart) return;
            currentFrameIndex = (currentFrameIndex + 1) % recordedFrames.length;
            const frame = recordedFrames[currentFrameIndex];
            selectedPart.joints.forEach((j, i) => { if (frame[i]) { j.x = frame[i].x; j.y = frame[i].y; } });
            document.getElementById('timeline').value = currentFrameIndex;
            document.getElementById('timelineInfo').innerHTML = `<div>Frame: ${currentFrameIndex + 1}/${recordedFrames.length}</div>`;
            render();
            setTimeout(animateLoop, 200);
        }

        function stopAnimation() {
            isPlaying = false;
            document.getElementById('playBtn').textContent = '▶️ Play';
        }

        function scrubTimeline() {
            if (recordedFrames.length === 0) return;
            currentFrameIndex = parseInt(document.getElementById('timeline').value);
            const frame = recordedFrames[currentFrameIndex];
            if (selectedPart) {
                selectedPart.joints.forEach((j, i) => { if (frame[i]) { j.x = frame[i].x; j.y = frame[i].y; } });
            }
            document.getElementById('timelineInfo').innerHTML = `<div>Frame: ${currentFrameIndex + 1}/${recordedFrames.length}</div>`;
            render();
        }

        function exportJSON() {
            const data = {
                parts: parts.map((p, i) => ({id: i, name: p.name, joints: p.joints, connections: p.connections})),
                animation: recordedFrames
            };
            document.getElementById('jsonOutput').value = JSON.stringify(data, null, 2);
        }

        function copyToClipboard() {
            document.getElementById('jsonOutput').select();
            document.execCommand('copy');
            alert('Copied!');
        }

        function downloadJSON() {
            const json = document.getElementById('jsonOutput').value;
            const blob = new Blob([json], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'roboptixx.json';
            link.click();
        }

        function render() {
            ctx.fillStyle = '#FFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#EEE';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
            parts.forEach(p => p.draw(ctx, p === selectedPart));
            ctx.fillStyle = '#FFD700';
            ctx.font = '12px monospace';
            ctx.fillText(`Parts: ${parts.length}`, 10, 20);
        }

        canvas.addEventListener('click', e => {
            const r = canvas.getBoundingClientRect();
            const x = e.clientX - r.left, y = e.clientY - r.top;
            for (let i = parts.length - 1; i >= 0; i--) {
                if (parts[i].contains(x, y)) {
                    selectedPart = parts[i];
                    const jIdx = selectedPart.getJointAt(x, y);
                    if (jIdx === -1) {
                        selectedPart.joints.push({x: x - selectedPart.x, y: y - selectedPart.y});
                    }
                    updatePartsUI();
                    render();
                    return;
                }
            }
            selectedPart = null;
            updatePartsUI();
            render();
        });

        canvas.addEventListener('mousedown', e => {
            if (!selectedPart) return;
            const r = canvas.getBoundingClientRect();
            const x = e.clientX - r.left, y = e.clientY - r.top;
            const jIdx = selectedPart.getJointAt(x, y);
            if (jIdx !== -1) {
                draggedJointInfo = {
                    jIdx: jIdx,
                    ox: x - (selectedPart.x + selectedPart.joints[jIdx].x),
                    oy: y - (selectedPart.y + selectedPart.joints[jIdx].y)
                };
            }
        });

        canvas.addEventListener('mousemove', e => {
            if (!draggedJointInfo || !selectedPart) return;
            const r = canvas.getBoundingClientRect();
            const x = e.clientX - r.left, y = e.clientY - r.top;
            const j = selectedPart.joints[draggedJointInfo.jIdx];
            j.x = x - selectedPart.x - draggedJointInfo.ox;
            j.y = y - selectedPart.y - draggedJointInfo.oy;
            render();
        });

        canvas.addEventListener('mouseup', () => { draggedJointInfo = null; });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth - 320;
            canvas.height = window.innerHeight;
            render();
        });

        setTimeout(() => {
            canvas.width = window.innerWidth - 320;
            canvas.height = window.innerHeight;
            render();
            console.log('✅ ROBOPTIXX Ready!');
        }, 100);
    </script>
</body>
</html>
