<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RobotSim IDE</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <button id="new-project">New</button>
      <button id="save-project">Save</button>
      <label class="file-label">Load<input id="load-project" type="file" accept="application/json" hidden /></label>
      <button id="toggle-simulate">Simulate</button>
      <button id="export-arduino">Generate Arduino Code</button>
      <label><input type="checkbox" id="toggle-minimap" checked /> Minimap</label>
      <label><input type="checkbox" id="toggle-gravity" checked /> Gravity</label>
    </header>

    <aside id="left-panel">
      <h3>Parts</h3>
      <label>Category
        <select id="part-category"></select>
      </label>
      <div id="part-buttons"></div>
      <button id="create-hinge">Create Hinge Joint (selected x2)</button>
      <button id="delete-selected">Delete Selected</button>
    </aside>

    <main id="viewport-wrap">
      <canvas id="viewport"></canvas>
      <canvas id="minimap"></canvas>
      <div id="snap-indicator"></div>
    </main>

    <aside id="right-panel">
      <h3>Inspector</h3>
      <div id="inspector-empty">Select a part or hinge joint.</div>
      <div id="inspector-fields" class="hidden">
        <label>Mass <input id="ins-mass" type="number" step="0.1" min="0" /></label>
        <label>Min Angle (deg) <input id="ins-min-angle" type="number" /></label>
        <label>Max Angle (deg) <input id="ins-max-angle" type="number" /></label>
        <label>Speed (deg/s) <input id="ins-speed" type="number" min="1" /></label>
        <label>Arduino Pin <input id="ins-pin" type="number" min="0" max="53" /></label>
        <label><input id="ins-motor" type="checkbox" /> Motor Enabled</label>
      </div>
    </aside>

    <footer id="bottom-panel">
      <button id="timeline-record">Record</button>
      <button id="timeline-play">Play</button>
      <button id="timeline-stop">Stop</button>
      <button id="timeline-clear">Clear</button>
      <label>Playback Speed <input id="timeline-speed" type="number" min="0.1" step="0.1" value="1" /></label>
      <span id="timeline-status">Timeline: Idle</span>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
