<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ROBOPTIXX</title>
  <style>
    body { background: #1a1d23; color: #67b7ff; font-family: monospace; margin: 0; }
    #canvas { display: block; width: 100%; height: 100vh; background: #2a2d33; }
    #ui { position: fixed; top: 20px; left: 20px; background: #2a2d33; padding: 20px; border: 1px solid #3a3d43; z-index: 100; }
    h1 { color: #ff6b6b; margin: 0 0 15px 0; }
    button { width: 100%; padding: 10px; margin: 5px 0; background: #3a7dd8; color: white; border: none; cursor: pointer; }
    button:hover { background: #4a8de8; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <h1>ROBOPTIXX</h1>
    <button onclick="addPart()">Add Cube</button>
    <button onclick="clear()">Clear</button>
    <div id="status">✓ Ready</div>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let parts = [];
    
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; render(); }
    function addPart() { parts.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, w: 50, h: 50}); render(); }
    function clear() { parts = []; render(); }
    function render() {
      ctx.fillStyle = '#1a1d23'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#3a7dd8';
      parts.forEach(p => ctx.fillRect(p.x-p.w/2, p.y-p.h/2, p.w, p.h));
    }
    
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
