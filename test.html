<!DOCTYPE html>
<html>
<head>
  <title>ROBOPTIXX TEST</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1a1410; }
    #main { display: flex; }
    canvas { background: white; flex: 1; }
    #sidebar { width: 300px; background: #1a1410; border-left: 3px solid #FF8C00; padding: 15px; overflow-y: auto; }
    h2 { color: #FFD700; }
    button { width: 100%; padding: 10px; margin: 5px 0; background: #FF8C00; border: none; cursor: pointer; color: #1a1410; font-weight: bold; }
    button:hover { background: #FFA500; }
  </style>
</head>
<body>
  <div id="main">
    <canvas id="c"></canvas>
    <div id="sidebar">
      <h2>ROBOPTIXX</h2>
      <button onclick="add('Limb')">+ Limb</button>
      <button onclick="add('Joint')">+ Joint</button>
      <button onclick="add('Core')">+ Core</button>
      <div id="list"></div>
      <button onclick="del()">Delete</button>
      <button onclick="clear()">Clear All</button>
    </div>
  </div>

  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    let parts = [], sel = null;

    class Part {
      constructor(x, y, n) { this.x = x; this.y = y; this.n = n; this.w = 50; this.h = 50; }
      draw(s) {
        ctx.fillStyle = s ? '#FF4444' : '#FF7F50';
        ctx.fillRect(this.x-this.w/2, this.y-this.h/2, this.w, this.h);
        ctx.strokeStyle = s ? '#FFD700' : '#FF8C00';
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x-this.w/2, this.y-this.h/2, this.w, this.h);
      }
      hit(x, y) { return x > this.x-this.w/2 && x < this.x+this.w/2 && y > this.y-this.h/2 && y < this.y+this.h/2; }
    }

    function add(name) {
      parts.push(new Part(c.width/3 + Math.random()*100, 80 + parts.length*70, name));
      ui();
      render();
    }

    function del() {
      if (!sel) return;
      parts = parts.filter(p => p !== sel);
      sel = null;
      ui();
      render();
    }

    function clear() {
      if (confirm('Clear?')) { parts = []; sel = null; ui(); render(); }
    }

    function ui() {
      let h = '';
      parts.forEach((p, i) => {
        h += `<div onclick="selectPart(${i})" style="background: ${p===sel?'#FF8C00':'#2a2015'}; color: ${p===sel?'#1a1410':'#FFE4B5'}; padding: 8px; margin: 5px 0; cursor: pointer; border-radius: 3px;">${i+1}. ${p.n}</div>`;
      });
      document.getElementById('list').innerHTML = h || '<div style="color:#FFE4B5; padding:10px;">No parts</div>';
    }

    function selectPart(i) { sel = parts[i]; ui(); render(); }

    function render() {
      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = '#FFD700';
      ctx.font = '12px monospace';
      ctx.fillText('Parts: ' + parts.length, 10, 20);
      parts.forEach(p => p.draw(p === sel));
    }

    c.addEventListener('click', e => {
      const r = c.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      for (let i = parts.length-1; i >= 0; i--) {
        if (parts[i].hit(x, y)) { sel = parts[i]; ui(); render(); return; }
      }
      sel = null; ui(); render();
    });

    c.addEventListener('mousemove', e => {
      if (sel) {
        const r = c.getBoundingClientRect();
        sel.x = e.clientX - r.left;
        sel.y = e.clientY - r.top;
        render();
      }
    });

    function resize() { c.width = window.innerWidth - 300; c.height = window.innerHeight; render(); }
    window.addEventListener('resize', resize);
    resize();
  </script>
</body>
</html>
